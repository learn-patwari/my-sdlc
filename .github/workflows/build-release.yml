name: Build & Package SprintForge

on:
  push:
    branches: [ "claude/sdlc-copilot-architecture-a65lfd", "main" ]
    tags:     [ "v*" ]
  workflow_dispatch:

jobs:
  build-maui:
    name: Build (Windows — MAUI)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Restore
        run: dotnet restore src/SprintForge.Maui/SprintForge.Maui.csproj -p:TargetFrameworks=net8.0-windows10.0.19041.0

      - name: Build MAUI (Windows)
        run: |
          dotnet build src/SprintForge.Maui/SprintForge.Maui.csproj `
            -c Release `
            -f net8.0-windows10.0.19041.0 `
            --no-restore

      - name: Test
        run: |
          dotnet build tests/SprintForge.Tests/SprintForge.Tests.csproj -c Release
          dotnet test tests/SprintForge.Tests/SprintForge.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish MAUI win-x64
        run: |
          dotnet publish src/SprintForge.Maui/SprintForge.Maui.csproj `
            -c Release `
            -f net8.0-windows10.0.19041.0 `
            -p:WindowsPackageType=None `
            -p:PublishSingleFile=false `
            -o publish/SprintForge-maui-win

      - name: Upload MAUI Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SprintForge-maui-win
          path: publish/SprintForge-maui-win/
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"

  build:
    name: Build (Windows — WPF)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore SprintForge.sln --ignore-failed-sources

      - name: Build shared layers
        run: |
          dotnet build src/SprintForge.Domain/SprintForge.Domain.csproj -c Release --no-restore
          dotnet build src/SprintForge.Application/SprintForge.Application.csproj -c Release --no-restore
          dotnet build src/SprintForge.Infrastructure/SprintForge.Infrastructure.csproj -c Release --no-restore
          dotnet build src/SprintForge.ViewModels/SprintForge.ViewModels.csproj -c Release --no-restore
          dotnet build src/SprintForge.Wpf/SprintForge.Wpf.csproj -c Release --no-restore

      - name: Publish self-contained EXE (win-x64)
        run: |
          dotnet publish src/SprintForge.Wpf/SprintForge.Wpf.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish/SprintForge-win-x64

      - name: Build installer (Inno Setup)
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc installer\sprintforge.iss
        shell: powershell

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: SprintForge-win-x64-portable
          path: publish/SprintForge-win-x64/SprintForge.exe
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SprintForge-Installer
          path: installer/output/Setup.exe
          if-no-files-found: error

  release:
    needs: [build, build-maui]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download Windows EXE (WPF)
        uses: actions/download-artifact@v4
        with:
          name: SprintForge-win-x64-portable
          path: dist/win

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: SprintForge-Installer
          path: dist/installer

      - name: Download MAUI Windows build
        uses: actions/download-artifact@v4
        with:
          name: SprintForge-maui-win
          path: dist/maui-win

      - name: Zip MAUI build
        run: |
          cd dist/maui-win
          zip -r ../SprintForge-maui-win.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/win/SprintForge.exe
            dist/installer/Setup.exe
            dist/SprintForge-maui-win.zip
          generate_release_notes: true
