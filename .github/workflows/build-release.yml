name: Build & Package SprintForge

on:
  push:
    branches: [ "claude/sdlc-copilot-architecture-a65lfd", "main" ]
    tags:     [ "v*" ]
  workflow_dispatch:

jobs:
  build-cross-platform:
    name: Build (Linux — Avalonia)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore SprintForge-CrossPlatform.slnf

      - name: Build
        run: dotnet build SprintForge-CrossPlatform.slnf -c Release --no-restore

      - name: Test
        run: dotnet test tests/SprintForge.Tests/SprintForge.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results-linux.trx"

      - name: Publish linux-x64
        run: |
          dotnet publish src/SprintForge.Avalonia/SprintForge.Avalonia.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o publish/SprintForge-linux-x64

      - name: Upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: SprintForge-linux-x64-portable
          path: publish/SprintForge-linux-x64/SprintForge
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: "**/*.trx"

  build:
    name: Build (Windows — WPF + Avalonia)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore SprintForge.sln

      - name: Build (all projects)
        run: dotnet build SprintForge.sln -c Release --no-restore

      - name: Test (cross-platform projects)
        run: dotnet test tests/SprintForge.Tests/SprintForge.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish self-contained EXE (win-x64)
        run: |
          dotnet publish src/SprintForge.Wpf/SprintForge.Wpf.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish/SprintForge-win-x64

      - name: Build installer (Inno Setup)
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc installer\sprintforge.iss
        shell: powershell

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: SprintForge-win-x64-portable
          path: publish/SprintForge-win-x64/SprintForge.exe
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SprintForge-Installer
          path: installer/output/Setup.exe
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"

  release:
    needs: [build, build-cross-platform]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: SprintForge-win-x64-portable
          path: dist/win

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: SprintForge-Installer
          path: dist/installer

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: SprintForge-linux-x64-portable
          path: dist/linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/win/SprintForge.exe
            dist/installer/Setup.exe
            dist/linux/SprintForge
          generate_release_notes: true
